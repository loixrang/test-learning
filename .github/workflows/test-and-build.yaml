name: Testing and Building my app
on: push
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: getting my code first
        uses: actions/checkout@v6
      - name: installing node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: installing dependencies
        run: npm ci
      - name: testing app
        run: npm run dev
